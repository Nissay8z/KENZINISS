name: Build IPTV-org Vstro V20 public TV catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iptvorg-maghreb-assets.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download only Algeria Morocco Tunisia from official IPTV-org
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, json, datetime
          dest = pathlib.Path('iptvorg')
          dest.mkdir(exist_ok=True)
          data = {}
          for code, country in [('dz','Algerie'),('ma','Maroc'),('tn','Tunisie'),('fr','France'),('be','Belgique'),('gb','Royaume-Uni'),('es','Espagne'),('de','Allemagne'),('it','Italie')]:
              url = 'https://iptv-org.github.io/iptv/countries/' + code + '.m3u'
              req = urllib.request.Request(url, headers={'User-Agent':'Vstro-Maghreb-Playlist/1.0','Accept':'audio/x-mpegurl,text/plain,*/*'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  payload = response.read()
              text = payload.decode('utf-8-sig')
              count = sum(1 for line in text.splitlines() if line.startswith('#EXTINF:'))
              assert text.startswith('#EXTM3U'), 'Invalid M3U: ' + code
              assert count > 0, 'Empty playlist: ' + code
              (dest / (code + '.m3u')).write_bytes(payload)
              data[code] = {'name':country,'entries':count,'bytes':len(payload),'source':url}
              print(code, country, count, len(payload))
          (dest / 'stats.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload offline M3U catalog files
        uses: actions/upload-artifact@v4
        with:
          name: iptvorg-vstro-v20-public-countries
          path: iptvorg/
          retention-days: 2
          if-no-files-found: error
