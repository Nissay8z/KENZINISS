name: Audit Vstro Vegeta and OZTV public catalog
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vstro-v23-source-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read public catalog shapes without exporting credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, pathlib, re, collections
          dest=pathlib.Path('vstro_source_audit')
          dest.mkdir(exist_ok=True)
          report={}
          urls={
            'vegeta':'https://raw.githubusercontent.com/rikital/onyxia-data/main/data/vegetatv/vegeta-fr.json',
            'oztv':'https://api.apioztv.online/api/v2/config'
          }
          def cleanse(v, depth=0):
              if depth>3:return '[nested]'
              if isinstance(v,list):return [cleanse(x,depth+1) for x in v[:2]]
              if isinstance(v,dict):
                  return {k:cleanse(x,depth+1) for k,x in list(v.items())[:15] if not re.search('pass|user|token|key|auth|cookie|secret|license',k,re.I)}
              if isinstance(v,str):
                  if re.search(r'https?://|[?&](?:user|pass|token|auth|key)=',v,re.I):return '[URL redacted]'
                  return v[:100]
              return v
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Vstro-Catalog-Audit/1.0','Accept':'application/json,*/*'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(10_000_000)
                      code=r.status
                  data=json.loads(body)
                  report[name]={'http':code,'bytes':len(body),'root_type':type(data).__name__,
                                'keys':list(data)[:40] if isinstance(data,dict) else None,
                                'count':len(data) if isinstance(data,(list,dict)) else None,
                                'sample':cleanse(data)}
                  if name=='vegeta':
                      channels=data.get('channels',{})
                      counts=collections.Counter()
                      fieldsets=collections.Counter()
                      hostnames=collections.Counter()
                      sample_streams=[]
                      for key,ch in channels.items():
                          streams=ch.get('streams',[]) if isinstance(ch,dict) else []
                          counts['channels']+=1
                          counts['streams']+=len(streams)
                          counts['channels_with_streams']+=bool(streams)
                          if isinstance(ch,dict) and ch.get('category'):counts['category_set']+=1
                          for st in streams:
                              if isinstance(st,dict):
                                  for fld in st:fieldsets[fld]+=1
                                  # URLs are not exported; count potential credentials or query keys only
                                  for val in st.values():
                                      if not isinstance(val,str):continue
                                      if re.search(r'https?://',val):
                                          counts['url_fields']+=1
                                          if re.search(r'(?i)user(name)?=|pass(word)?=|token=|access_token=|api_key=|/live/[^/]+/[^/]+/',val):counts['credential_or_token_url_fields']+=1
                                          try:
                                              from urllib.parse import urlparse
                                              u=urlparse(val);hostnames[u.netloc.split(':')[0]]+=1
                                          except:pass
                                  if len(sample_streams)<3:
                                      sample_streams.append({k:('[URL redacted]' if isinstance(v,str) and '://' in v else str(v)[:80]) for k,v in st.items()})
                      # Count stream URL shapes without emitting the URLs themselves
                      from urllib.parse import urlparse
                      formats=collections.Counter();strict_count=0
                      for ch in channels.values():
                          if not isinstance(ch,dict):continue
                          for st in ch.get('streams',[]):
                              if not isinstance(st,dict):continue
                              url=st.get('url','')
                              if not isinstance(url,str) or not url.startswith(('http://','https://')):continue
                              parsed=urlparse(url);path=parsed.path.lower()
                              fmt='m3u8' if '.m3u8' in path else 'ts' if path.endswith('.ts') else 'mpd' if '.mpd' in path else 'other'
                              formats[fmt]+=1
                              sensitive=bool(re.search(r'(?i)user(name)?=|pass(word)?=|token=|access_token=|api_key=|/live/[^/]+/[^/]+/',url))
                              strict=fmt=='m3u8' and not parsed.query and not parsed.username and not parsed.password and not sensitive
                              if strict:strict_count+=1
                      report[name]['url_formats']=dict(formats)
                      report[name]['strict_plain_hls_urls']=strict_count
                      report[name]['statistics']=dict(counts)
                      report[name]['stream_field_counts']=dict(fieldsets.most_common(30))
                      report[name]['host_count']=len(hostnames)
                      report[name]['sample_streams']=sample_streams
              except Exception as e:
                  report[name]={'error':str(e)[:300]}
          more={
             'vegeta_v2_bootstrap':'http://vegetatvv2.duckdns.org/bootstrap.php?v=114',
             'vegeta_v2_status':'http://vegetatvv2.duckdns.org/data/server_status.json',
             'vegeta_onyx_status':'http://vegetatv.duckdns.org/data/server_status.json',
             'oztv_live_public':'https://api.apioztv.online/api/v1/live/channels/list'
          }
          for name,url in more.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Vstro-Catalog-Audit/1.0','Accept':'application/json,*/*'})
                  with urllib.request.urlopen(req,timeout=10) as res:
                      raw=res.read(1000000);status=res.status
                  try:
                      obj=json.loads(raw)
                      report[name]={'status':status,'bytes_sample':len(raw),'type':type(obj).__name__,
                                    'keys':list(obj)[:25] if isinstance(obj,dict) else None,
                                    'length':len(obj) if isinstance(obj,(list,dict)) else None,
                                    'preview':cleanse(obj)}
                      if name.startswith('vegeta_') and isinstance(obj,dict):
                          entries=obj.get('list',[])
                          if isinstance(entries,list):
                              report[name]['server_count']=len(entries)
                              report[name]['server_fields']=dict(collections.Counter(k for x in entries if isinstance(x,dict) for k in x).most_common(35))
                              report[name]['server_sample']=[cleanse(x) for x in entries[:2]]
                  except:
                      report[name]={'status':status,'bytes_sample':len(raw),'content_type':'non-json'}
              except urllib.error.HTTPError as ex:
                  report[name]={'http_status':ex.code}
              except Exception as ex:
                  report[name]={'error_type':type(ex).__name__}
          try:
              body=b'{}';req=urllib.request.Request('https://api.apioztv.online/api/v2/config',data=body,method='POST',headers={'User-Agent':'Vstro-Catalog-Audit/1.0','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=10) as res:
                  raw=res.read(500000);status=res.status
              try:ob=json.loads(raw);report['oztv_post']={'http':status,'root_keys':list(ob)[:20] if isinstance(ob,dict) else [],'kind':type(ob).__name__}
              except:report['oztv_post']={'http':status,'kind':'not-json'}
          except urllib.error.HTTPError as ex:report['oztv_post']={'http_status':ex.code}
          except Exception as ex:report['oztv_post']={'error_type':type(ex).__name__}
          (dest/'source_report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          for key,val in report.items():
              print(key, {k:v for k,v in val.items() if k not in ('sample',)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vstro-source-audit
          path: vstro_source_audit/source_report.json
          retention-days: 2
