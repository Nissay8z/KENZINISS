      - name: Committer et pousser les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist/vavoo.m3u
          # Ne commit que s'il y a des changements
          git diff --staged --quiet || git commit -m "Mise à jour automatique de la playlist Vavoo"
          
          # --- AJOUT DE LA LOGIQUE DE RÉCUPÉRATION ---
          # Récupère les derniers changements du dépôt distant
          git pull --rebase origin main
          # Pousse la modification en toute sécurité
          git push
