name: Vstro TV — Onyx sources (sans Pluto Samsung musique)
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_vstro_extras.py'
      - '.github/workflows/refresh-vstro-extras.yml'
permissions:
  contents: write
concurrency:
  group: vstro-extras-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actualiser les chaînes TV Onyx, sans musique/Pluto/Samsung
        run: python scripts/refresh_vstro_extras.py
      - name: Commit des seules playlists Vstro supplémentaires
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/vstro-extras.m3u playlist/vstro-extras-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Vstro: actualiser sources TV Onyx, sans Pluto/Samsung/musique'
            git pull --rebase -X theirs origin main
            git push
          fi
