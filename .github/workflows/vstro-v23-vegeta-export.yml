name: Export Vstro V23 Vegeta public direct HLS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vstro-v23-vegeta-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export only public non-authenticated HLS URLs from Onyx Vegeta catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json,pathlib,collections,ipaddress
          url='https://raw.githubusercontent.com/rikital/onyxia-data/main/data/vegetatv/vegeta-fr.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Vstro-Source-Export/1.0'})
          with urllib.request.urlopen(req,timeout=35) as r:
              data=json.load(r)
          channels=data.get('channels',{})
          dest=pathlib.Path('vstro_vegeta_export');dest.mkdir(exist_ok=True)
          pattern=re.compile(r'(?i)user(name)?=|pass(word)?=|token=|access_token=|api[_-]?key=|auth=|/live/[^/]+/[^/]+/|/movie/[^/]+/[^/]+/|/series/[^/]+/[^/]+/')
          adult=re.compile(r'(?i)\bXXX\b|\bPORN\b|\bADULT\b|\bBRAZZERS\b|\bPLAYBOY\b')
          def group(name):
              x=name.upper()
              if re.search(r'MAROC|MOROCCO|\b2M\b|ARRIADIA|AL AOULA|MEDI 1',x):return 'Maroc'
              if re.search(r'ALGERI|ALGÉRI|CHOUROUK|ENNAHAR|ENTV|CANAL ALG',x):return 'Algérie'
              if re.search(r'TUNIS|WATANIYA|NESSMA|HANNIBAL',x):return 'Tunisie'
              if re.search(r'SSC SPORT|AL KASS|ALKASS|BEIN SPORTS AR|DUBAI SPORTS|ABU DHABI SPORTS',x):return 'Arabia Sport'
              if re.search(r'CANAL\+ LIVE|EUROSPORT|RMC SPORT|BEIN SPORTS? FR|FOOT\+|LIGUE 1\+|CANAL\+ SPORT',x):return 'France Sport'
              if re.search(r'\b(TF1|TFX|TMC|M6|W9|6TER|ARTE|FRANCE ?[2345]|BFMTV|LCI|CNEWS|C8|CSTAR|CANAL\+)\b',x):return 'France'
              if re.search(r'FRANCE|FRENCH|\bFR\b',x):return 'France'
              if re.search(r'BEIN|SPORT|ESPN|DAZN',x):return 'Sport International'
              return 'Autres'
          entries=[];seen=set();c=collections.Counter();no_safe=0
          for ident,ch in channels.items():
              if not isinstance(ch,dict):continue
              name=str(ch.get('displayName') or ident).strip()
              if not name or adult.search(name):continue
              for stream in ch.get('streams',[]):
                  if not isinstance(stream,dict):continue
                  src=stream.get('url','')
                  if not isinstance(src,str):continue
                  p=urllib.parse.urlsplit(src)
                  if p.scheme not in ('http','https') or not p.hostname or '.m3u8' not in p.path.lower():continue
                  if p.query or p.fragment or p.username or p.password or pattern.search(src):continue
                  if re.search(r'[^a-z0-9.-]',p.hostname.lower()):continue
                  try:
                      ip=ipaddress.ip_address(p.hostname)
                      if not ip.is_global:continue
                  except ValueError:pass
                  k=(name,src)
                  if k in seen:continue
                  seen.add(k)
                  cat=group(name);c[cat]+=1
                  entries.append((name,cat,src))
          lines=['#EXTM3U']
          def clean(s):return str(s).replace('"','').replace('\r',' ').replace('\n',' ')[:180]
          for name,cat,src in entries:
              # The tag retains provenance; URLs are already public and contain no auth-query.
              lines.append('#EXTINF:-1 provider="vegeta" tvg-name="%s" group-title="%s",%s [Vegeta]'%(clean(name),clean(cat),clean(name)))
              lines.append(src)
          (dest/'vegeta_public_hls.m3u').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          stat={'source':url,'source_saved_at':data.get('savedAt'),'original_channels':len(channels),'safe_hls_entries':len(entries),'categories':dict(c),'example_names':[x[0] for x in entries[:35]]}
          (dest/'stats.json').write_text(json.dumps(stat,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Exported direct, no-query HLS: ',len(entries),'by category',dict(c))
          assert len(entries)>50,'Insufficient public HLS streams'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vstro-v23-vegeta-safe-hls
          path: vstro_vegeta_export/
          retention-days: 2
          if-no-files-found: error
