name: Mise à jour automatique de la playlist Vavoo

on:
  schedule:
    - cron: '0 */6 * * *' # Toutes les 6 heures
  workflow_dispatch: # Bouton pour lancer manuellement

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer requests
        run: pip install requests

      - name: Générer la playlist M3U
        run: python generate_m3u.py

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist/vavoo.m3u
          git diff --staged --quiet || git commit -m "Mise à jour via Proxy"
          git pull --rebase origin main
          git push
