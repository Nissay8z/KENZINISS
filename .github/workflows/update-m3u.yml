name: IPTV-org master M3U
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - generate_m3u.py
      - .github/workflows/update-m3u.yml
      - requirements.txt
permissions:
  contents: write
jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate global IPTV-org playlist
        run: python generate_m3u.py
      - name: Commit updated master playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist/master.m3u
          if git diff --staged --quiet; then
            echo "master.m3u is unchanged"
            exit 0
          fi
          git commit -m "Update global IPTV-org master playlist"
          git pull --rebase origin main
          git push origin HEAD:main
